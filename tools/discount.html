<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Discount Calculator - ToolNest</title>

    <meta
        name="description"
        content="Calculate discounts, savings, and final prices with the free ToolNest Discount Calculator."
    >

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f1115;
            color: white;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 8%;
            border-bottom: 1px solid #252830;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        header a {
            color: #aaa;
            text-decoration: none;
        }

        header a:hover {
            color: white;
        }

        .page {
            width: 90%;
            max-width: 700px;
            margin: 70px auto;
        }

        .page h1 {
            text-align: center;
            font-size: 45px;
            margin-bottom: 15px;
        }

        .description {
            text-align: center;
            color: #888;
            margin-bottom: 40px;
        }

        .calculator {
            background: #181b21;
            border: 1px solid #292c34;
            border-radius: 18px;
            padding: 30px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #aaa;
        }

        input {
            width: 100%;
            padding: 16px;

            background: #101217;
            color: white;

            border: 1px solid #333;
            border-radius: 10px;

            font-size: 17px;
            outline: none;
        }

        input:focus {
            border-color: #666;
        }

        button {
            width: 100%;
            padding: 16px;

            border: none;
            border-radius: 10px;

            background: white;
            color: black;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #ddd;
        }

        .results {
            display: none;

            margin-top: 25px;

            background: #101217;

            border: 1px solid #272a32;
            border-radius: 12px;

            overflow: hidden;
        }

        .result {
            padding: 20px;

            display: flex;
            justify-content: space-between;
            gap: 20px;

            border-bottom: 1px solid #272a32;
        }

        .result:last-child {
            border-bottom: none;
        }

        .result-label {
            color: #888;
        }

        .result-value {
            font-weight: bold;
            text-align: right;
        }

        .final-price {
            font-size: 24px;
        }

        .error {
            display: none;

            margin-top: 15px;
            padding: 15px;

            background: #211416;

            border: 1px solid #48282b;
            border-radius: 10px;

            color: #ff9b9b;

            text-align: center;
        }

        @media (max-width: 500px) {

            .page h1 {
                font-size: 38px;
            }

            .result {
                flex-direction: column;
                gap: 8px;
            }

            .result-value {
                text-align: left;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="logo">
        ToolNest
    </div>

    <a href="../index.html">
        ← Back to ToolNest
    </a>

</header>


<main class="page">


    <h1>
        Discount Calculator
    </h1>


    <p class="description">
        Find the discount, amount saved, and final price.
    </p>


    <div class="calculator">


        <div class="input-group">

            <label for="price">
                Original Price
            </label>

            <input
                id="price"
                type="number"
                min="0"
                step="0.01"
                placeholder="Example: 80"
            >

        </div>


        <div class="input-group">

            <label for="discount">
                Discount Percentage
            </label>

            <input
                id="discount"
                type="number"
                min="0"
                max="100"
                step="0.01"
                placeholder="Example: 25"
            >

        </div>


        <button onclick="calculateDiscount()">
            Calculate Discount
        </button>


        <div
            class="error"
            id="error"
        ></div>


        <div
            class="results"
            id="results"
        >


            <div class="result">

                <div class="result-label">
                    Original Price
                </div>

                <div
                    class="result-value"
                    id="originalPrice"
                >
                    $0.00
                </div>

            </div>


            <div class="result">

                <div class="result-label">
                    You Save
                </div>

                <div
                    class="result-value"
                    id="amountSaved"
                >
                    $0.00
                </div>

            </div>


            <div class="result">

                <div class="result-label">
                    Final Price
                </div>

                <div
                    class="result-value final-price"
                    id="finalPrice"
                >
                    $0.00
                </div>

            </div>


        </div>


    </div>


</main>


<script>


    function calculateDiscount() {


        const priceInput =
            document.getElementById("price");


        const discountInput =
            document.getElementById("discount");


        const results =
            document.getElementById("results");


        const error =
            document.getElementById("error");


        const price =
            Number(priceInput.value);


        const discount =
            Number(discountInput.value);


        error.style.display = "none";


        results.style.display = "none";


        if (
            priceInput.value === "" ||
            discountInput.value === ""
        ) {

            showError(
                "Please enter both the price and discount."
            );

            return;

        }


        if (price < 0) {

            showError(
                "The price cannot be negative."
            );

            return;

        }


        if (
            discount < 0 ||
            discount > 100
        ) {

            showError(
                "Discount must be between 0% and 100%."
            );

            return;

        }


        const savings =
            price * (discount / 100);


        const finalPrice =
            price - savings;


        document.getElementById(
            "originalPrice"
        ).textContent =
            formatMoney(price);


        document.getElementById(
            "amountSaved"
        ).textContent =
            formatMoney(savings);


        document.getElementById(
            "finalPrice"
        ).textContent =
            formatMoney(finalPrice);


        results.style.display =
            "block";

    }


    function formatMoney(amount) {

        return new Intl.NumberFormat(
            "en-US",
            {
                style: "currency",
                currency: "USD"
            }
        ).format(amount);

    }


    function showError(message) {

        const error =
            document.getElementById("error");


        error.textContent =
            message;


        error.style.display =
            "block";

    }


</script>


</body>

</html>
