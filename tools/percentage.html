<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Percentage Calculator - ToolNest</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f1115;
            color: white;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 8%;
            border-bottom: 1px solid #252830;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        header a {
            color: #aaa;
            text-decoration: none;
        }

        header a:hover {
            color: white;
        }

        .calculator-page {
            max-width: 700px;
            margin: 80px auto;
            padding: 20px;
        }

        .calculator-page h1 {
            text-align: center;
            font-size: 45px;
            margin-bottom: 15px;
        }

        .description {
            text-align: center;
            color: #888;
            margin-bottom: 45px;
        }

        .calculator {
            background: #181b21;
            border: 1px solid #292c34;
            border-radius: 18px;
            padding: 35px;
        }

        .calculator h2 {
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #aaa;
        }

        input {
            width: 100%;
            padding: 16px;
            border-radius: 10px;
            border: 1px solid #333;
            background: #101217;
            color: white;
            font-size: 17px;
            outline: none;
        }

        input:focus {
            border-color: #666;
        }

        button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 10px;
            background: white;
            color: black;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        button:hover {
            background: #ddd;
        }

        #result {
            margin-top: 25px;
            padding: 20px;
            background: #101217;
            border-radius: 10px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            display: none;
        }

    </style>

</head>


<body>

    <header>

        <div class="logo">
            ToolNest
        </div>

        <a href="../index.html">
            ← Back to ToolNest
        </a>

    </header>


    <main class="calculator-page">

        <h1>Percentage Calculator</h1>

        <p class="description">
            Calculate percentages quickly and easily.
        </p>


        <div class="calculator">

            <h2>What is X% of Y?</h2>


            <div class="input-group">

                <label for="percentage">
                    Percentage
                </label>

                <input
                    id="percentage"
                    type="number"
                    placeholder="Example: 25"
                >

            </div>


            <div class="input-group">

                <label for="number">
                    Number
                </label>

                <input
                    id="number"
                    type="number"
                    placeholder="Example: 200"
                >

            </div>


            <button onclick="calculatePercentage()">
                Calculate
            </button>


            <div id="result"></div>

        </div>

    </main>


    <script>

        function calculatePercentage() {

            const percentage =
                Number(document.getElementById("percentage").value);

            const number =
                Number(document.getElementById("number").value);

            const result =
                (percentage / 100) * number;


            const resultBox =
                document.getElementById("result");


            if (
                document.getElementById("percentage").value === "" ||
                document.getElementById("number").value === ""
            ) {

                resultBox.style.display = "block";

                resultBox.innerText =
                    "Please enter both numbers.";

                return;

            }


            resultBox.style.display = "block";

            resultBox.innerText =
                "Answer: " + result;

        }

    </script>

</body>

</html>
