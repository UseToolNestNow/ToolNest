<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="description"
    content="Free age calculator. Find your exact age in years, months, and days."
>

<meta
    name="robots"
    content="index, follow"
>

<link
    rel="canonical"
    href="https://usetoolnestnow.github.io/ToolNest/tools/age.html"
>

<link
    rel="icon"
    href="../favicon.svg"
    type="image/svg+xml"
>

<title>Age Calculator - ToolNest</title>


<style>

/* ================================
   RESET
================================ */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {

    font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;

    background:
        #080a0f;

    color:
        white;

    min-height:
        100vh;

    overflow-x:
        hidden;
}


/* ================================
   ANIMATED GRID
================================ */

.grid-background {

    position: fixed;

    inset: 0;

    z-index: -5;

    pointer-events: none;

    opacity: .22;

    background-image:

        linear-gradient(
            rgba(255,255,255,.025) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(255,255,255,.025) 1px,
            transparent 1px
        );

    background-size:
        55px 55px;

    mask-image:
        linear-gradient(
            to bottom,
            black,
            transparent 85%
        );

    animation:
        gridMove 18s linear infinite;
}

@keyframes gridMove {

    from {
        transform:
            translateY(0);
    }

    to {
        transform:
            translateY(55px);
    }

}


/* ================================
   AMBIENT LIGHT
================================ */

.glow {

    position: fixed;

    width:
        500px;

    height:
        500px;

    top:
        -250px;

    left:
        50%;

    transform:
        translateX(-50%);

    border-radius:
        50%;

    background:
        #6677ff;

    filter:
        blur(110px);

    opacity:
        .10;

    pointer-events:
        none;

    z-index:
        -4;

    animation:
        glowFloat 8s ease-in-out infinite;
}

@keyframes glowFloat {

    0%,
    100% {
        transform:
            translateX(-50%)
            scale(1);
    }

    50% {
        transform:
            translateX(-50%)
            scale(1.15);
    }

}


/* ================================
   HEADER
================================ */

header {

    position:
        sticky;

    top:
        12px;

    z-index:
        100;

    width:
        94%;

    max-width:
        1200px;

    margin:
        12px auto 0;

    display:
        flex;

    justify-content:
        space-between;

    align-items:
        center;

    padding:
        14px 18px;

    background:
        rgba(10,12,17,.72);

    backdrop-filter:
        blur(25px)
        saturate(150%);

    -webkit-backdrop-filter:
        blur(25px)
        saturate(150%);

    border:
        1px solid
        rgba(255,255,255,.08);

    border-radius:
        17px;

    box-shadow:
        0 20px 60px
        rgba(0,0,0,.3);

    animation:
        headerEnter .8s
        cubic-bezier(.16,1,.3,1)
        both;
}

@keyframes headerEnter {

    from {
        opacity:
            0;

        transform:
            translateY(-25px)
            scale(.96);
    }

    to {
        opacity:
            1;

        transform:
            translateY(0)
            scale(1);
    }

}


.logo {

    color:
        white;

    text-decoration:
        none;

    font-size:
        23px;

    font-weight:
        900;

    letter-spacing:
        -1px;

    transition:
        .3s ease;
}

.logo:hover {

    transform:
        scale(1.05);

    filter:
        drop-shadow(
            0 0 15px
            rgba(255,255,255,.2)
        );
}


.back-link {

    color:
        #8b909b;

    text-decoration:
        none;

    font-size:
        13px;

    font-weight:
        650;

    padding:
        9px 12px;

    border-radius:
        9px;

    transition:
        all .25s ease;
}

.back-link:hover {

    color:
        white;

    background:
        rgba(255,255,255,.06);

    transform:
        translateX(-3px);
}


/* ================================
   PAGE ENTRANCE
================================ */

.calculator-page {

    width:
        92%;

    max-width:
        720px;

    margin:
        90px auto 100px;

    animation:
        pageEnter 1s
        cubic-bezier(.16,1,.3,1)
        both;
}

@keyframes pageEnter {

    from {

        opacity:
            0;

        transform:
            translateY(40px)
            scale(.97);

        filter:
            blur(7px);
    }

    to {

        opacity:
            1;

        transform:
            translateY(0)
            scale(1);

        filter:
            blur(0);
    }

}


/* ================================
   TITLE
================================ */

.title-area {

    text-align:
        center;

    margin-bottom:
        42px;
}


.title-badge {

    display:
        inline-flex;

    align-items:
        center;

    gap:
        8px;

    padding:
        8px 13px;

    margin-bottom:
        20px;

    background:
        rgba(255,255,255,.045);

    border:
        1px solid
        rgba(255,255,255,.08);

    border-radius:
        100px;

    color:
        #aeb2bc;

    font-size:
        11px;

    font-weight:
        750;

    animation:
        badgeFloat 3s ease-in-out infinite;
}

@keyframes badgeFloat {

    0%,
    100% {
        transform:
            translateY(0);
    }

    50% {
        transform:
            translateY(-4px);
    }

}


.title-badge::before {

    content:
        "";

    width:
        7px;

    height:
        7px;

    border-radius:
        50%;

    background:
        #70ff9b;

    box-shadow:
        0 0 15px
        rgba(112,255,155,.8);

    animation:
        pulse 1.8s ease-in-out infinite;
}

@keyframes pulse {

    0%,
    100% {

        transform:
            scale(.8);

        opacity:
            .5;
    }

    50% {

        transform:
            scale(1.2);

        opacity:
            1;
    }

}


.calculator-page h1 {

    font-size:
        clamp(40px,7vw,58px);

    line-height:
        1;

    letter-spacing:
        -3px;

    margin-bottom:
        16px;

    background:
        linear-gradient(
            180deg,
            #fff,
            #dfe1e6 45%,
            #747984
        );

    -webkit-background-clip:
        text;

    background-clip:
        text;

    color:
        transparent;
}


.description {

    color:
        #858a96;

    font-size:
        16px;

    line-height:
        1.6;
}


/* ================================
   CALCULATOR
================================ */

.calculator {

    position:
        relative;

    background:
        linear-gradient(
            145deg,
            rgba(27,30,38,.94),
            rgba(13,15,20,.97)
        );

    border:
        1px solid
        rgba(255,255,255,.09);

    border-radius:
        22px;

    padding:
        32px;

    box-shadow:
        0 35px 90px
        rgba(0,0,0,.4),

        inset 0 1px 0
        rgba(255,255,255,.04);

    overflow:
        hidden;

    transition:
        transform .35s ease,
        border-color .35s ease,
        box-shadow .35s ease;
}


.calculator::before {

    content:
        "";

    position:
        absolute;

    width:
        300px;

    height:
        300px;

    top:
        -180px;

    right:
        -100px;

    border-radius:
        50%;

    background:
        rgba(100,115,255,.09);

    filter:
        blur(70px);

    pointer-events:
        none;

    animation:
        cardGlow 6s ease-in-out infinite;
}

@keyframes cardGlow {

    0%,
    100% {
        transform:
            scale(1);
    }

    50% {
        transform:
            scale(1.25);
    }

}


.calculator:hover {

    border-color:
        rgba(255,255,255,.14);

    box-shadow:
        0 40px 100px
        rgba(0,0,0,.48),

        0 0 45px
        rgba(100,110,255,.04);
}


.calculator h2 {

    position:
        relative;

    font-size:
        20px;

    margin-bottom:
        28px;

    letter-spacing:
        -.4px;
}


/* ================================
   INPUT
================================ */

.input-group {

    margin-bottom:
        20px;

    animation:
        inputEnter .7s
        cubic-bezier(.16,1,.3,1)
        both;
}

@keyframes inputEnter {

    from {

        opacity:
            0;

        transform:
            translateY(15px);
    }

    to {

        opacity:
            1;

        transform:
            translateY(0);
    }

}


label {

    display:
        block;

    margin-bottom:
        9px;

    color:
        #a2a6b0;

    font-size:
        13px;

    font-weight:
        650;
}


input {

    width:
        100%;

    padding:
        17px;

    background:
        rgba(8,10,14,.82);

    color:
        white;

    border:
        1px solid
        rgba(255,255,255,.09);

    border-radius:
        12px;

    font-size:
        16px;

    outline:
        none;

    transition:
        all .3s ease;

    color-scheme:
        dark;

    box-shadow:
        inset 0 1px 0
        rgba(255,255,255,.025);
}


input:hover {

    border-color:
        rgba(255,255,255,.15);
}


input:focus {

    border-color:
        rgba(255,255,255,.3);

    background:
        rgba(12,14,19,.95);

    box-shadow:
        0 0 0 4px
        rgba(120,130,255,.07),

        0 10px 30px
        rgba(0,0,0,.2);

    transform:
        translateY(-1px);
}


/* ================================
   BUTTON
================================ */

button {

    position:
        relative;

    width:
        100%;

    padding:
        17px;

    margin-top:
        5px;

    border:
        none;

    border-radius:
        12px;

    background:
        white;

    color:
        #08090c;

    font-size:
        15px;

    font-weight:
        850;

    cursor:
        pointer;

    overflow:
        hidden;

    transition:
        all .3s
        cubic-bezier(.16,1,.3,1);

    box-shadow:
        0 10px 30px
        rgba(255,255,255,.06);
}


button::before {

    content:
        "";

    position:
        absolute;

    top:
        0;

    left:
        -120%;

    width:
        70%;

    height:
        100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.8),
            transparent
        );

    transform:
        skewX(-20deg);

    transition:
        left .6s ease;
}


button:hover::before {

    left:
        150%;
}


button:hover {

    background:
        #f0f0f0;

    transform:
        translateY(-3px)
        scale(1.01);

    box-shadow:
        0 15px 40px
        rgba(255,255,255,.12);
}


button:active {

    transform:
        translateY(0)
        scale(.985);
}


/* ================================
   RESULT
================================ */

#result {

    margin-top:
        22px;

    padding:
        22px;

    background:
        rgba(8,10,14,.75);

    border:
        1px solid
        rgba(255,255,255,.08);

    border-radius:
        13px;

    text-align:
        center;

    font-size:
        20px;

    font-weight:
        700;

    line-height:
        1.6;

    color:
        #ffffff;

    display:
        none;

    animation:
        resultEnter .45s
        cubic-bezier(.16,1,.3,1)
        both;
}

#result.show {
    display:
        block;
}


#result strong {

    display:
        block;

    margin-top:
        3px;

    font-size:
        22px;

    background:
        linear-gradient(
            90deg,
            #fff,
            #aeb4ff,
            #fff
        );

    background-size:
        200% auto;

    -webkit-background-clip:
        text;

    background-clip:
        text;

    color:
        transparent;

    animation:
        resultShine 3s linear infinite;
}

@keyframes resultShine {

    from {
        background-position:
            0% center;
    }

    to {
        background-position:
            200% center;
    }

}


@keyframes resultEnter {

    from {

        opacity:
            0;

        transform:
            translateY(12px)
            scale(.96);
    }

    to {

        opacity:
            1;

        transform:
            translateY(0)
            scale(1);
    }

}


/* ================================
   MOBILE
================================ */

@media (max-width:600px) {

    header {

        width:
            92%;

        top:
            8px;

        padding:
            12px 14px;
    }

    .logo {
        font-size:
            20px;
    }

    .back-link {
        font-size:
            12px;
    }

    .calculator-page {

        width:
            92%;

        margin:
            70px auto 80px;
    }

    .calculator-page h1 {

        letter-spacing:
            -2px;
    }

    .calculator {

        padding:
            22px;

        border-radius:
            18px;
    }

}


/* ================================
   ACCESSIBILITY
================================ */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {

        animation-duration:
            .01ms !important;

        animation-iteration-count:
            1 !important;

        transition-duration:
            .01ms !important;

        scroll-behavior:
            auto !important;
    }

}

</style>

</head>


<body>


<div class="grid-background"></div>

<div class="glow"></div>


<header>

<a
    class="logo"
    href="../index.html"
>
    ToolNest
</a>

<a
    class="back-link"
    href="../index.html"
>
    ← Back to ToolNest
</a>

</header>


<main class="calculator-page">


<div class="title-area">

<div class="title-badge">
Free Tool
</div>

<h1>
Age Calculator
</h1>

<p class="description">
Find out exactly how old you are.
</p>

</div>


<div class="calculator">

<h2>
Enter your birthday
</h2>


<div class="input-group">

<label for="birthday">
Date of Birth
</label>

<input
    id="birthday"
    type="date"
>

</div>


<button
    id="calculateButton"
    onclick="calculateAge()"
>
Calculate Age
</button>


<div id="result"></div>


</div>

</main>


<script>


function calculateAge() {

    const birthdayInput =
        document.getElementById(
            "birthday"
        ).value;

    const resultBox =
        document.getElementById(
            "result"
        );


    if (!birthdayInput) {

        resultBox.innerHTML =
            "Please enter your birthday.";

        resultBox.classList.remove(
            "show"
        );

        void resultBox.offsetWidth;

        resultBox.classList.add(
            "show"
        );

        return;

    }


    const birthday =
        new Date(
            birthdayInput + "T00:00:00"
        );


    const today =
        new Date();


    if (birthday > today) {

        resultBox.innerHTML =
            "Your birthday cannot be in the future.";

        resultBox.classList.remove(
            "show"
        );

        void resultBox.offsetWidth;

        resultBox.classList.add(
            "show"
        );

        return;

    }


    let years =
        today.getFullYear() -
        birthday.getFullYear();


    let months =
        today.getMonth() -
        birthday.getMonth();


    let days =
        today.getDate() -
        birthday.getDate();


    if (days < 0) {

        months--;

        const previousMonth =
            new Date(
                today.getFullYear(),
                today.getMonth(),
                0
            );

        days +=
            previousMonth.getDate();

    }


    if (months < 0) {

        years--;

        months += 12;

    }


    resultBox.innerHTML =
        "You are <strong>" +
        years +
        " years, " +
        months +
        " months, and " +
        days +
        " days old.</strong>";


    resultBox.classList.remove(
        "show"
    );

    void resultBox.offsetWidth;

    resultBox.classList.add(
        "show"
    );

}


/* Enter key support */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            calculateAge();

        }

    }
);


</script>


</body>

</html>
