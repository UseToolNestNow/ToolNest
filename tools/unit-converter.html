<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Unit Converter - ToolNest</title>

    <meta
        name="description"
        content="Free online unit converter for length, weight, temperature, speed, time, area, and data."
    >

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f1115;
            color: white;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 8%;
            border-bottom: 1px solid #252830;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        header a {
            color: #aaa;
            text-decoration: none;
        }

        header a:hover {
            color: white;
        }

        .page {
            width: 90%;
            max-width: 850px;
            margin: 70px auto;
        }

        .page h1 {
            text-align: center;
            font-size: 45px;
            margin-bottom: 15px;
        }

        .description {
            text-align: center;
            color: #888;
            margin-bottom: 40px;
        }

        .converter {
            background: #181b21;
            border: 1px solid #292c34;
            border-radius: 18px;
            padding: 30px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #aaa;
            font-size: 14px;
        }

        select,
        input {
            width: 100%;
            padding: 16px;

            background: #101217;
            color: white;

            border: 1px solid #333;
            border-radius: 10px;

            font-size: 16px;
            outline: none;
        }

        select:focus,
        input:focus {
            border-color: #666;
        }

        .conversion-row {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 12px;
            align-items: end;
        }

        .swap-button {
            width: 48px;
            height: 48px;

            border: 1px solid #333;
            border-radius: 10px;

            background: #101217;
            color: white;

            font-size: 20px;
            cursor: pointer;
        }

        .swap-button:hover {
            background: #24272e;
        }

        .result {
            margin-top: 25px;
            padding: 30px;

            background: #101217;
            border: 1px solid #272a32;
            border-radius: 12px;

            text-align: center;
        }

        .result-label {
            color: #888;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .result-value {
            font-size: 32px;
            font-weight: bold;
            word-break: break-word;
        }

        .result-unit {
            color: #888;
            margin-top: 8px;
        }

        @media (max-width: 650px) {

            .conversion-row {
                grid-template-columns: 1fr;
            }

            .swap-button {
                width: 100%;
            }

            .page h1 {
                font-size: 38px;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="logo">
        ToolNest
    </div>

    <a href="../index.html">
        ← Back to ToolNest
    </a>

</header>


<main class="page">

    <h1>
        Unit Converter
    </h1>

    <p class="description">
        Convert measurements quickly and accurately.
    </p>


    <div class="converter">


        <div class="input-group">

            <label for="category">
                Conversion Type
            </label>

            <select id="category">

                <option value="length">
                    Length
                </option>

                <option value="weight">
                    Weight
                </option>

                <option value="temperature">
                    Temperature
                </option>

                <option value="speed">
                    Speed
                </option>

                <option value="time">
                    Time
                </option>

                <option value="area">
                    Area
                </option>

                <option value="data">
                    Data
                </option>

            </select>

        </div>


        <div class="input-group">

            <label for="amount">
                Value
            </label>

            <input
                id="amount"
                type="number"
                inputmode="decimal"
                placeholder="Enter a value"
            >

        </div>


        <div class="conversion-row">


            <div class="input-group">

                <label for="fromUnit">
                    From
                </label>

                <select id="fromUnit"></select>

            </div>


            <button
                class="swap-button"
                id="swapButton"
                title="Swap units"
            >
                ⇄
            </button>


            <div class="input-group">

                <label for="toUnit">
                    To
                </label>

                <select id="toUnit"></select>

            </div>


        </div>


        <div class="result">

            <div class="result-label">
                Result
            </div>

            <div
                class="result-value"
                id="result"
            >
                0
            </div>

            <div
                class="result-unit"
                id="resultUnit"
            ></div>

        </div>


    </div>

</main>


<script>


    const category =
        document.getElementById("category");

    const amount =
        document.getElementById("amount");

    const fromUnit =
        document.getElementById("fromUnit");

    const toUnit =
        document.getElementById("toUnit");

    const result =
        document.getElementById("result");

    const resultUnit =
        document.getElementById("resultUnit");

    const swapButton =
        document.getElementById("swapButton");


    /*
     * UNIT DATABASE
     */

    const units = {

        length: {

            "Meter": 1,
            "Kilometer": 1000,
            "Centimeter": 0.01,
            "Millimeter": 0.001,
            "Mile": 1609.344,
            "Yard": 0.9144,
            "Foot": 0.3048,
            "Inch": 0.0254

        },


        weight: {

            "Kilogram": 1,
            "Gram": 0.001,
            "Milligram": 0.000001,
            "Pound": 0.45359237,
            "Ounce": 0.0283495231

        },


        speed: {

            "Meters per second": 1,
            "Kilometers per hour": 0.277777778,
            "Miles per hour": 0.44704,
            "Feet per second": 0.3048

        },


        time: {

            "Second": 1,
            "Minute": 60,
            "Hour": 3600,
            "Day": 86400,
            "Week": 604800

        },


        area: {

            "Square meter": 1,
            "Square kilometer": 1000000,
            "Square centimeter": 0.0001,
            "Square foot": 0.09290304,
            "Square yard": 0.83612736,
            "Acre": 4046.8564224,
            "Hectare": 10000

        },


        data: {

            "Byte": 1,
            "Kilobyte": 1024,
            "Megabyte": 1048576,
            "Gigabyte": 1073741824,
            "Terabyte": 1099511627776

        }

    };


    const temperatureUnits = [

        "Celsius",
        "Fahrenheit",
        "Kelvin"

    ];


    /*
     * CREATE UNIT OPTIONS
     */

    function populateUnits() {

        fromUnit.innerHTML = "";

        toUnit.innerHTML = "";


        let availableUnits;


        if (
            category.value === "temperature"
        ) {

            availableUnits =
                temperatureUnits;

        } else {

            availableUnits =
                Object.keys(
                    units[category.value]
                );

        }


        availableUnits.forEach(
            function(unit) {

                fromUnit.add(
                    new Option(unit, unit)
                );

                toUnit.add(
                    new Option(unit, unit)
                );

            }
        );


        if (availableUnits.length > 1) {

            toUnit.selectedIndex = 1;

        }


        convert();

    }


    /*
     * CONVERT
     */

    function convert() {

        if (amount.value === "") {

            result.textContent = "0";

            resultUnit.textContent = "";

            return;

        }


        const value =
            Number(amount.value);


        let converted;


        if (
            category.value === "temperature"
        ) {

            converted =
                convertTemperature(
                    value,
                    fromUnit.value,
                    toUnit.value
                );

        } else {

            const baseValue =
                value *
                units[category.value][fromUnit.value];


            converted =
                baseValue /
                units[category.value][toUnit.value];

        }


        result.textContent =
            formatNumber(converted);


        resultUnit.textContent =
            toUnit.value;

    }


    /*
     * TEMPERATURE CONVERSION
     */

    function convertTemperature(
        value,
        from,
        to
    ) {

        let celsius;


        if (from === "Celsius") {

            celsius = value;

        }

        else if (from === "Fahrenheit") {

            celsius =
                (value - 32) * 5 / 9;

        }

        else {

            celsius =
                value - 273.15;

        }


        if (to === "Celsius") {

            return celsius;

        }


        if (to === "Fahrenheit") {

            return (
                celsius * 9 / 5
            ) + 32;

        }


        return celsius + 273.15;

    }


    /*
     * FORMAT RESULT
     */

    function formatNumber(number) {

        if (!Number.isFinite(number)) {

            return "0";

        }


        return Number(
            number.toFixed(8)
        ).toLocaleString(
            undefined,
            {
                maximumFractionDigits: 8
            }
        );

    }


    /*
     * SWAP UNITS
     */

    swapButton.addEventListener(
        "click",
        function() {

            const oldFrom =
                fromUnit.value;

            const oldTo =
                toUnit.value;


            fromUnit.value =
                oldTo;

            toUnit.value =
                oldFrom;


            convert();

        }
    );


    /*
     * EVENTS
     */

    category.addEventListener(
        "change",
        populateUnits
    );


    amount.addEventListener(
        "input",
        convert
    );


    fromUnit.addEventListener(
        "change",
        convert
    );


    toUnit.addEventListener(
        "change",
        convert
    );


    /*
     * INITIALIZE
     */

    populateUnits();


</script>


</body>

</html>
