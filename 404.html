<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>404 - ToolNest</title>

    <meta
        name="robots"
        content="noindex"
    >

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {
            font-family: Arial, sans-serif;

            min-height: 100vh;

            display: flex;

            flex-direction: column;

            background:
                radial-gradient(
                    circle at top,
                    #1b1f2a,
                    #0f1115 50%
                );

            color: white;
        }


        header {
            padding: 20px 8%;

            border-bottom:
                1px solid #252830;
        }


        .logo {
            color: white;

            text-decoration: none;

            font-size: 25px;

            font-weight: 800;
        }


        main {
            flex: 1;

            display: flex;

            justify-content: center;

            align-items: center;

            text-align: center;

            padding: 40px 20px;
        }


        .error {

            max-width: 600px;
        }


        .number {

            font-size: 120px;

            font-weight: 900;

            letter-spacing: -8px;

            color: #2d323c;

            margin-bottom: -10px;
        }


        h1 {

            font-size: 32px;

            margin-bottom: 15px;
        }


        p {

            color: #888;

            line-height: 1.6;

            margin-bottom: 30px;
        }


        .button {

            display: inline-block;

            padding: 13px 20px;

            background: white;

            color: black;

            border-radius: 9px;

            text-decoration: none;

            font-weight: bold;

            font-size: 14px;

            transition: 0.2s;
        }


        .button:hover {

            transform:
                translateY(-2px);

            background: #ddd;
        }


        footer {

            border-top:
                1px solid #252830;

            padding: 25px;

            text-align: center;

            color: #666;

            font-size: 13px;
        }

    </style>

</head>


<body>


<header>

    <a
        class="logo"
        href="index.html"
    >
        ToolNest
    </a>

</header>


<main>

    <div class="error">

        <div class="number">
            404
        </div>


        <h1>
            This page doesn't exist.
        </h1>


        <p>
            Looks like you wandered somewhere
            outside of ToolNest. Let's get you back
            to the tools.
        </p>


        <a
            class="button"
            href="index.html"
        >
            ← Back to ToolNest
        </a>

    </div>

</main>


<footer>

    ToolNest © 2026 — Free online tools.

</footer>


</body>

</html>
